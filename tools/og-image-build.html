<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #120b07;
    font-family: 'Hanken Grotesk', -apple-system, sans-serif;
    color: #f5eee2;
  }
  .grid {
    position: absolute; inset: -1px;
    background-image:
      linear-gradient(rgba(196,203,209,.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(196,203,209,.08) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(ellipse 70% 70% at 25% 40%, #000 40%, transparent 85%);
  }
  .vignette {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 55% 65% at 18% 35%, rgba(255,138,61,.22), transparent 60%),
      linear-gradient(100deg, #0a0604 0%, #120b07 55%, #120b07 100%);
  }
  .fence {
    position: absolute; inset: 0; opacity: .5;
    background-image: repeating-linear-gradient(115deg, transparent 0 38px, rgba(255,138,61,.10) 38px 40px);
    mask-image: linear-gradient(100deg, #000 0%, transparent 45%);
  }
  .corner { position: absolute; width: 34px; height: 34px; z-index: 3; }
  .corner--tl { top: 40px; left: 40px; border-top: 3px solid rgba(245,238,226,.5); border-left: 3px solid rgba(245,238,226,.5); }
  .corner--br { bottom: 40px; right: 40px; border-bottom: 3px solid rgba(245,238,226,.5); border-right: 3px solid rgba(245,238,226,.5); }
  .rec {
    position: absolute; top: 40px; right: 40px; z-index: 3;
    display: flex; align-items: center; gap: 8px;
    font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600;
    letter-spacing: .1em; color: #ff4433;
    background: rgba(10,6,4,.6); padding: 8px 14px; border-radius: 6px;
    border: 1px solid rgba(255,255,255,.1);
  }
  .rec-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff4433; box-shadow: 0 0 8px 1px #ff4433; }
  .content { position: relative; z-index: 2; padding: 76px 80px; }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 56px; }
  .brand img { height: 56px; width: auto; filter: drop-shadow(0 2px 10px rgba(0,0,0,.6)); }
  .brand-word { font-family: 'Teko', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: .02em; text-transform: uppercase; }
  .brand-word b { font-weight: 700; color: #ff8a3d; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace; font-size: 15px; letter-spacing: .1em;
    color: #ff8a3d; text-transform: uppercase; margin-bottom: 22px;
  }
  h1 {
    font-family: 'Teko', sans-serif; font-weight: 700; text-transform: uppercase;
    font-size: 76px; line-height: .96; letter-spacing: .005em; max-width: 820px;
  }
  h1 em { font-style: normal; color: #ff8a3d; }
  .sub {
    margin-top: 26px; max-width: 660px; font-size: 21px; line-height: 1.5; color: #c7cdd3;
  }
</style>
</head>
<body>
  <div class="fence"></div>
  <div class="grid"></div>
  <div class="vignette"></div>
  <span class="corner corner--tl"></span>
  <span class="corner corner--br"></span>
  <span class="rec"><span class="rec-dot"></span>BAURU/SP</span>
  <div class="content">
    <div class="brand">
      <img src="../images/logo-mark-160.webp" alt="">
      <span class="brand-word">FOX <b>GUARDIAN</b></span>
    </div>
    <p class="eyebrow">CFTV · ALARME · CERCA ELÉTRICA · CONCERTINA</p>
    <h1>SEGURANÇA QUE <em>VIGIA</em> ENQUANTO VOCÊ VIVE.</h1>
    <p class="sub">Monitoramento 24h com ronda, instalação de CFTV, alarme e cerca elétrica em Bauru e região. Orçamento pelo WhatsApp.</p>
  </div>
</body>
</html>
